[project]
name = "financeagents"
version = "0.3.0"
description = "LLM-assisted stock briefs and educational model portfolios"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["venv", ".cortex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
